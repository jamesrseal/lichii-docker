name: Inspect base image (temporary)
on:
  push:
    branches: [main]
    paths: [".github/workflows/inspect-base.yml"]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: |
          img=josh5/steam-headless:2
          docker pull -q "$img"
          docker image inspect "$img" --format 'created={{.Created}} cmd={{.Config.Cmd}}{{println}}labels={{json .Config.Labels}}{{println}}vols={{json .Config.Volumes}}'
          docker run --rm --entrypoint /bin/sh "$img" -c '
            sec() { echo; echo "=========== $*"; }
            sec sh-init.d; ls -la /usr/local/sh-init.d
            sec sunshine-wrapper-tail; sed -n "80,400p" /usr/local/bin/steam-headless-sunshine
            sec init-scripts-mentioning-sunshine-or-home; grep -n -i -E "sunshine|chown|\.config" /usr/local/sh-init.d/*.sh | head -60
            sec steam-desktop; cat /usr/share/applications/steam.desktop 2>/dev/null | head -20; ls /usr/share/sunshine | head; ls /usr/share/sunshine/web/images 2>/dev/null | grep -E "desktop|steam"
            sec appimage; ls /usr/bin | grep -E "^(fusermount|fusermount3|pkill|setsid|unsquashfs)$" | tr "\n" " "
          ' 2>&1 | head -700
