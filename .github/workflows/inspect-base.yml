name: Inspect base image (temporary)
on:
  push:
    branches: [main]
    paths: [".github/workflows/inspect-base.yml"]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for img in josh5/steam-headless:latest josh5/steam-headless:debian; do
            echo "=================== $img"
            docker pull -q "$img" || { echo "PULL FAILED"; continue; }
            docker image inspect "$img" --format 'created={{.Created}} entry={{.Config.Entrypoint}} cmd={{.Config.Cmd}} user={{.Config.User}}{{println}}labels={{json .Config.Labels}}{{println}}env={{json .Config.Env}}'
            docker run --rm --entrypoint /bin/sh "$img" -c '
              grep -E "^(PRETTY_NAME|VERSION_ID)" /etc/os-release; ldd --version | head -1
              echo "--- pkg managers"; ls /usr/bin /usr/sbin 2>/dev/null | grep -E "^(apt-get|dpkg|pacman|dnf|dnf5|microdnf|rpm|rpm-ostree|flatpak|jq|curl|sunshine.*|steam.*|supervisord|Xorg|sway|gamescope|labwc)$" | sort -u | tr "\n" " "; echo
              echo "--- root"; ls -A / | tr "\n" " "; echo
              echo "--- init dirs"; ls -d /etc/cont-init.d /etc/s6-overlay /etc/supervisor.d /templates /templates/* /opt/* /usr/share/applications 2>/dev/null | tr "\n" " "; echo
              ls /etc/cont-init.d 2>/dev/null | tr "\n" " "; echo
              echo "--- entrypoint"; for f in /entrypoint.sh /init /usr/local/bin/entrypoint*; do [ -f "$f" ] && { echo "## $f"; head -c 3000 "$f"; echo; }; done
              echo "--- sunshine files"; find / -xdev \( -iname "*sunshine*" -o -name "apps.json" \) -not -path "/proc/*" -not -path "/usr/share/doc/*" 2>/dev/null | head -40
              echo "--- home"; ls -A /home /home/* 2>/dev/null | head -30
              echo "--- libs"; ls /usr/lib64 /usr/lib/x86_64-linux-gnu 2>/dev/null | grep -E "libxcb-cursor|libvulkan\.so" | sort -u | tr "\n" " "; echo
            ' 2>&1 | head -200
            docker rmi -f "$img" >/dev/null 2>&1 || true
          done
